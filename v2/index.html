<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0e14">
<title>big-AGI v2 — The Persona Suite</title>
<meta name="description" content="Persona-driven AI suite. 14 character personas, BYO-key streaming chat, side-by-side beams. Zero backend — everything stays in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234fd8e8'/%3E%3Cstop offset='1' stop-color='%238b7bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='4' width='92' height='92' rx='24' fill='%230e141d'/%3E%3Ccircle cx='50' cy='50' r='22' fill='url(%23g)'/%3E%3Ccircle cx='50' cy='50' r='9' fill='%230e141d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <button class="iconbtn" id="btnMenu" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3V6Zm0 5h18v2H3v-2Zm0 5h18v2H3v-2Z"/></svg>
    </button>
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 100 100"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e14"/><stop offset="1" stop-color="#1a2340"/></linearGradient></defs><circle cx="50" cy="50" r="40" fill="url(#lg)" stroke="#4fd8e8" stroke-width="5"/><circle cx="50" cy="50" r="14" fill="#4fd8e8"/><circle cx="50" cy="50" r="6" fill="#8b7bff"/></svg></span>
      <h1>big-AGI</h1>
      <span class="tag">v2 · persona suite</span>
    </div>
    <span class="spacer"></span>
    <button class="iconbtn" id="btnPersonas" aria-label="Personas">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a9 9 0 0 0-9 9c0 3.1 1.6 5.9 4 7.5V21a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-2.5c2.4-1.6 4-4.4 4-7.5a9 9 0 0 0-9-9Zm-3.5 9a1.8 1.8 0 1 1 0-3.6 1.8 1.8 0 0 1 0 3.6Zm7 0a1.8 1.8 0 1 1 0-3.6 1.8 1.8 0 0 1 0 3.6ZM12 17.5c-2.3 0-3.9-1.3-4.3-2.9h8.6c-.4 1.6-2 2.9-4.3 2.9Z"/></svg>
    </button>
    <button class="iconbtn" id="btnBeam" aria-label="Beam compare">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 4h8v16H3V4Zm10 0h8v7h-8V4Zm0 9h8v7h-8v-9Z"/></svg>
    </button>
    <button class="iconbtn" id="btnNew" aria-label="New chat">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></svg>
    </button>
    <button class="iconbtn" id="btnSettings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="m19.4 13a7.7 7.7 0 0 0 .1-1 7.7 7.7 0 0 0-.1-1l2.1-1.7a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.7 7.7 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.3 2.6a7.7 7.7 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.5 11a7.7 7.7 0 0 0 0 2l-2.1 1.7a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1a7.7 7.7 0 0 0 1.7 1l.4 2.6c0 .2.2.4.5.4h4c.2 0 .5-.2.5-.4l.3-2.6a7.7 7.7 0 0 0 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6L19.4 13ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/></svg>
    </button>
  </header>

  <div class="main">
    <div id="stage" class="stage"></div>

    <div class="drawer" id="drawer" aria-hidden="true">
      <div class="panel" role="dialog" aria-label="History and personas">
        <div class="panel-head">Library</div>
        <div class="chip-row">
          <button class="chip" id="chipHist">History</button>
          <button class="chip" id="chipPersonas">Personas</button>
        </div>
        <div class="panel-body" id="drawerBody"></div>
      </div>
    </div>
  </div>

  <div class="sheet-wrap" id="sheetWrap">
    <div class="sheet" id="sheet" role="dialog" aria-label="Sheet">
      <div class="grab"></div>
      <h2 id="sheetTitle">Settings</h2>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
